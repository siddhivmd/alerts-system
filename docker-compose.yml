services:
  monitor:
    build: .
    image: site-monitor:latest
    container_name: site-monitor
    restart: unless-stopped
    # Match your host user so the bind-mounted data/ and logs/ folders are writable.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env                      # SMTP_PASSWORD, TELEGRAM_BOT_TOKEN, DASHBOARD_PASSWORD, ...
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "8080:8080"                     # put a reverse proxy with HTTPS in front for internet access
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./ssh:/app/ssh:ro               # SSH private key; set vps.ssh.key_file: ssh/monitor_ed25519
      - ./data:/app/data                # SQLite history + SSH known_hosts
      - ./logs:/app/logs
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
