# Site monitor configuration. Copy to config.yaml and edit.
# Secrets (passwords, tokens) are NOT set here - put them in .env (see .env.example).
# Relative paths are resolved against the folder that contains this file.
#
# EVERYTHING IS OPTIONAL. Each feature has "enabled:"; turn features on one at a time.
# If a feature is enabled but a required value or secret is missing, it is switched
# off with a warning at startup - the rest keeps running. Minimum config: one site.
# For a ready-made test setup using public sites, see config.test.yaml.

general:
  check_interval_minutes: 5      # how often every site is checked
  max_workers: 20                # parallel checks (sites are checked concurrently)
  database: data/monitor.db      # SQLite history (sites, checks, incidents)
  log_file: logs/monitor.log     # rotated at 5 MB, 5 files kept
  log_level: INFO
  retention_days: 90             # check history older than this is deleted nightly (incidents are kept)
  timezone: Asia/Kolkata         # used for the daily report time and times shown in alerts
  user_agent: "SiteMonitor/1.0 (+uptime check)"
  # Before each cycle, check that THIS machine is online. If none of these answer, the cycle is
  # skipped ("monitor offline") instead of marking every site DOWN and sending fake alerts.
  connectivity_check: true
  canary_hosts: ["1.1.1.1:443", "8.8.8.8:53", "www.google.com:443", "cloudflare.com:443"]
  canary_timeout: 4

thresholds:
  ram_percent: 90                # RAM above this is reported as a cause when a site is down
  disk_percent: 95               # disk above this = "storage full" (critical)
  disk_warn_percent: 85          # early warning for disk
  cpu_load_per_core: 2.0         # 1-min load average divided by cores
  ssl_warn_days: 14              # first SSL expiry warning
  ssl_critical_days: 3           # second, critical SSL expiry warning
  domain_warn_days: 30           # WHOIS domain expiry warning

# Settings applied to every site unless the site overrides them.
defaults:
  timeout: 15                    # seconds
  slow_threshold_ms: 3000        # slower than this = "slow response" warning
  follow_redirects: true
  check_ssl: true
  check_domain: true             # WHOIS lookup (cached 24h)

vps:
  enabled: false                 # set true once host is your real VPS IP
  name: Hostinger VPS
  host: 1.2.3.4                  # your VPS IP address
  ports: [22, 80, 443]           # all closed = VPS down or ACCOUNT SUSPENDED
  port_timeout: 8
  ssh:                           # optional: RAM/disk/services/error logs. Needs a key on this machine.
    enabled: false
    user: monitor                # a dedicated low-privilege user is recommended (see README)
    port: 22
    key_file: ~/.ssh/monitor_ed25519   # passphrase (if any) goes in .env as SSH_KEY_PASSPHRASE
    use_sudo: false              # true = run journalctl/dmesg/tail/docker via "sudo -n" (see README)
    timeout: 10
    services: [nginx, apache2, httpd, mysql, mysqld, mariadb, "php*-fpm", docker]
    check_pm2: true
    check_docker_containers: true
    error_logs:                  # tail of these is attached to alerts when a site fails
      - /var/log/nginx/error.log
      - /var/log/apache2/error.log
    error_log_lines: 20

alerts:
  consecutive_failures: 2        # failures in a row before alerting (avoids false alarms)
  throttle_minutes: 30           # repeat a still-down alert at most this often
  warning_repeat_hours: 24       # repeat warnings (SSL/domain expiry, slow, disk) at most this often
  console: true                  # also print alert messages to the log - useful while testing
  email:
    enabled: false               # needs host, to, and SMTP_PASSWORD in .env
    host: smtp.gmail.com
    port: 465
    security: ssl                # ssl (port 465) | starttls (port 587) | none
    username: you@gmail.com      # password: SMTP_PASSWORD in .env (Gmail: an App Password)
    from_addr: you@gmail.com
    to:
      - you@company.com
      - teammate@company.com
  telegram:
    enabled: false               # needs TELEGRAM_BOT_TOKEN in .env and chat_ids
    chat_ids: ["123456789"]      # user or group chat ids (see README for how to find them)

# Dead-man's switch: the monitor cannot report its own death, so after every cycle it pings an
# outside service (free: healthchecks.io). If the pings stop - VM down, crashed, frozen - or a cycle
# reports failure (e.g. disk full), THAT service emails you. Ping URL goes in .env as HEARTBEAT_URL.
heartbeat:
  enabled: false
  fail_suffix: "/fail"           # healthchecks.io / Better Stack: <url>/fail = "I'm running but broken"

# Early warning of the "malicious activity" that gets VPS accounts suspended.
# All optional; delete the section to use these defaults, or set enabled: false.
security:
  enabled: true
  blacklist_check: true          # is the VPS IP on spam blacklists? free, no account, no SSH
  blacklist_interval_minutes: 60
  blacklists: [zen.spamhaus.org, bl.spamcop.net, psbl.surriel.com, dnsbl-1.uceprotect.net]
  extra_ips: []                  # other IPs to check too, e.g. a separate mail server
  safe_browsing: false           # Google flags a site as malware/phishing; key: GOOGLE_SAFE_BROWSING_KEY in .env
  safe_browsing_interval_minutes: 60
  # The checks below run over SSH, so they need vps.ssh:
  cpu_process_percent: 80        # an unknown process above this % CPU is reported
  known_processes: [nginx, apache2, "php*", mysqld, mariadbd, node, "PM2*", dockerd, "python*"]
  web_roots: [/var/www]          # watched for new or changed PHP files
  php_watch_minutes: 60
  php_watch_ignore: ["*/cache/*", "*/wp-content/upgrade/*"]
  failed_ssh_logins_per_hour: 100
  outbound_smtp_connections: 20  # open outbound mail connections = likely spam from a hacked site

daily_report:
  enabled: true
  time: "09:00"                  # in general.timezone
  channels: [email, console]     # any of: email, telegram, console

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8080
  username: admin                # password: DASHBOARD_PASSWORD in .env.
                                 # Without it the dashboard still runs, with no login, on 127.0.0.1 only.

sites:
  - name: Main Website
    url: https://example.com
    keyword: "Example Domain"    # must appear in the page (case-sensitive)

  - name: Client Portal
    url: https://portal.example.com/login
    keyword: "Login"
    forbidden_keywords:          # page is DOWN if any of these appear
      - "Error establishing a database connection"
      - "Fatal error"
    timeout: 20
    slow_threshold_ms: 5000
    error_log: /var/log/nginx/portal.error.log   # per-site log (optional)

  - name: API health
    url: https://api.example.com/health
    expected_status: [200, 204]
    headers:
      Accept: application/json
    domain: example.com          # WHOIS domain, if it cannot be derived from the URL

  - name: Marketing site (not on the VPS)
    url: https://www.example.org
    on_vps: false                # hosted elsewhere: skip VPS-based diagnosis
